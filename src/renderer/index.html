<meta charset="utf-8" />
<title>fleet — arbitrage d'attention</title>
<link rel="stylesheet" href="app.css" />
<link rel="stylesheet" href="style.css" />
<div id="app">
  <header id="topbar">
    <span id="dot" class="dot"></span>
    <span id="title">—</span>
    <span id="reason" class="reason"></span>
    <span class="spacer"></span>
    <button id="new" title="Démarre une nouvelle session Claude Code">+ session</button>
    <button id="pin" title="Fige le focus sur cette session">épingler</button>
    <button id="leave" title="Rend la main à la file">passer</button>
  </header>

  <main id="stage">
    <div id="empty">aucune session — « + session » pour en démarrer une</div>
    <div id="toast" hidden></div>
  </main>

  <footer id="rail"></footer>
</div>
<dialog id="create">
  <form id="create-form" method="dialog">
    <h2>Nouvelle session</h2>

    <label for="cwd">Répertoire de travail</label>
    <div class="row">
      <input id="cwd" name="cwd" placeholder="aucun répertoire choisi" readonly required />
      <button type="button" id="browse">parcourir…</button>
    </div>

    <label for="label">Nom</label>
    <input id="label" name="label" maxlength="40" placeholder="nom du répertoire" />

    <label for="prompt">Prompt initial <span class="hint">optionnel</span></label>
    <textarea id="prompt" name="prompt" rows="4"
              placeholder="ce que la session doit faire en démarrant"></textarea>

    <label for="model">Modèle</label>
    <select id="model" name="model"></select>

    <p id="create-error" class="error" hidden></p>

    <div class="actions">
      <button type="button" id="cancel">annuler</button>
      <button type="submit" id="submit" class="primary">démarrer</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
